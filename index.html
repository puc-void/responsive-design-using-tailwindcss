<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_right_alt" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="font-sans">
    <main class="md:bg-indigo-950 md:text-white md:p-5 md:border-2 md:border-violet-950">
        <nav class="md:flex justify-around">
            <h2 class="text-4xl font-bold">Tech<span
                    class="bg-gradient-to-r from-[#9100F8] via-[#FB09B4] to-[#F7E93F] bg-clip-text text-transparent">Wave</span>
            </h2>
            <ul class="flex gap-32 mt-2">
                <li> <a href="#">About</a></li>
                <li><a h href="#">Host </a></li>
                <li><a href="#">Episodes</a></li>
            </ul>
            <button class="text-white font-semibold bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8] rounded-3xl px-5 py-2 flex items-center justify-center gap-1
                hover:transition-all duration-300 hover:text-black hover:scale-105">
                Subscribe
                <span class="material-symbols-outlined">
                    arrow_right_alt
                </span>
            </button>
        </nav>
    </main>

    <section
        class="relative h-screen w-full overflow-hidden bg-[url('/assets/hero-bg.png')] bg-cover bg-center flex items-center justify-center">

        <div class="relative flex flex-col items-center text-center text-white">

            <div
                class="relative w-85 h-85 rounded-full bg-gradient-to-br from-[#F7E93F] via-[#FB09B4] to-[#9100F8] flex items-center justify-center border-4 border-[#3b2ea3] shadow-2xl">
                <button
                    class="absolute top-3 right-0 bg-[#7CFF7A] text-black text-sm font-bold px-4 py-2 rounded-full shadow-lg">
                    NEW
                </button>
                <img src="/assets/microphone.png" class="w-28" />
            </div>
            <h1 class="text-6xl font-bold mt-10">
                TechWave
            </h1>
            <p class="text-gray-300 mt-4 max-w-2xl text-lg">
                Your daily dose of tech insights, productivity hacks, and personal growth
            </p>
            <div class="flex gap-4 mt-8">

                <button
                    class="group px-8 py-3 rounded-full bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8] font-semibold flex gap-3 items-center transition-all duration-300 hover:scale-105 hover:-translate-y-1">

                    <img src="./assets/spotify.png" class="h-5 w-5">

                    Listen On Spotify

                </button>

                <button
                    class="group px-8 py-3 rounded-full border border-green-400 text-green-400 font-semibold flex gap-3 items-center transition-all duration-300 hover:bg-green-400 hover:text-black hover:scale-105 hover:-translate-y-1">

                    <img src="./assets/message.png" class="w-5 h-4 transition duration-300 group-hover:brightness-0">

                    Subscribe

                </button>

            </div>

        </div>

    </section>




</body>

</html>
